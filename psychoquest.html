<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Психодиагностика — Квест</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--s1:#0d1120;--s2:#141a30;--bd:#1c2840;--g:#e8b84b;--gl:#f5d47a;--b:#4a9eff;--m:#3ddba4;--r:#ff5c6a;--t:#dde5f5;--td:#7a8aaa;--tm:#3a4d6a;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--t);display:flex;flex-direction:column;overflow:hidden;}

/* NAV */
#nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--bd);flex-shrink:0;background:rgba(7,9,15,.96);backdrop-filter:blur(10px);position:relative;z-index:10;}
.nav-b{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--tm);}
.nav-b b{color:var(--g);font-weight:500;}
#ndots{display:flex;gap:5px;align-items:center;}
.nd{height:4px;width:20px;border-radius:2px;background:var(--bd);transition:all .4s;}
.nd.done{background:var(--td);}
.nd.active{background:var(--g);width:28px;}

/* MAIN */
#main{flex:1;overflow-y:auto;padding:28px 20px 80px;display:flex;align-items:flex-start;justify-content:center;}
@media(min-height:700px){#main{align-items:center;}}

/* BG GLOWS */
.bgd{position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
.bgd1{width:560px;height:560px;background:radial-gradient(circle,rgba(232,184,75,.06) 0%,transparent 70%);top:-180px;right:-120px;}
.bgd2{width:400px;height:400px;background:radial-gradient(circle,rgba(74,158,255,.04) 0%,transparent 70%);bottom:-100px;left:-80px;}

/* SLIDE */
.slide{width:100%;max-width:840px;position:relative;z-index:1;}
.fadein{animation:fi .38s ease both;}
@keyframes fi{from{opacity:0;transform:translateY(13px);}to{opacity:1;transform:translateY(0);}}

/* TYPE */
.lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--g);margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.lbl::before{content:'';width:15px;height:1px;background:var(--g);display:block;flex-shrink:0;}
h1{font-family:'Playfair Display',serif;font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.05;color:var(--t);margin-bottom:16px;}
h1 em{font-style:italic;color:var(--g);}
h2{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,3.5vw,2.1rem);line-height:1.2;color:var(--t);margin-bottom:13px;}
h3{font-size:.94rem;font-weight:600;color:var(--g);margin-bottom:6px;}
p{font-size:.91rem;line-height:1.7;color:var(--td);}

/* CARDS */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:17px 19px;}
.card+.card{margin-top:9px;}
.card-a{border-left:3px solid var(--g);padding-left:16px;}

/* BTNS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:var(--g);color:#140e00;border:none;border-radius:7px;cursor:pointer;font:600 .84rem/1 'Jost',sans-serif;letter-spacing:.04em;transition:background .18s,transform .15s;margin-top:17px;}
.btn:hover{background:var(--gl);transform:translateY(-1px);}
.btn-s{background:transparent;color:var(--td);border:1px solid var(--bd);}
.btn-s:hover{border-color:var(--td);background:var(--s1);}

/* CHOICES */
.choices{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.ch{display:flex;align-items:flex-start;gap:12px;padding:14px 15px;background:var(--s1);border:1px solid var(--bd);border-radius:9px;cursor:pointer;transition:border-color .17s,background .17s,transform .17s;text-align:left;font-family:'Jost',sans-serif;color:var(--t);width:100%;}
.ch:hover{border-color:var(--g);background:rgba(232,184,75,.07);transform:translateX(3px);}
.ch-l{min-width:24px;height:24px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--g);flex-shrink:0;margin-top:1px;}
.ch-m{font-size:.89rem;line-height:1.4;font-weight:500;display:block;}
.ch-s{font-size:.74rem;color:var(--tm);margin-top:3px;display:block;}

/* BADGES */
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px;}
.badge{padding:3px 8px;border-radius:20px;font-size:.72rem;font-weight:500;}
.bg{background:rgba(61,219,164,.1);color:var(--m);border:1px solid rgba(61,219,164,.24);}
.br{background:rgba(255,92,106,.1);color:var(--r);border:1px solid rgba(255,92,106,.24);}
.bb{background:rgba(74,158,255,.1);color:var(--b);border:1px solid rgba(74,158,255,.24);}
.bn{background:rgba(232,184,75,.1);color:var(--g);border:1px solid rgba(232,184,75,.24);}

/* CASE STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0;}
.stat{text-align:center;padding:13px 8px;background:var(--s2);border-radius:8px;border:1px solid var(--bd);}
.sv{font-family:'Playfair Display',serif;font-size:1.9rem;color:var(--g);display:block;}
.sl{font-size:.67rem;color:var(--tm);text-transform:uppercase;letter-spacing:.08em;}

/* INFO LIST */
.ilist{list-style:none;display:flex;flex-direction:column;gap:8px;margin:11px 0;}
.ilist li{display:flex;gap:9px;align-items:flex-start;font-size:.88rem;color:var(--td);line-height:1.5;}
.ilist .ic{flex-shrink:0;margin-top:1px;}

/* STEP TRACK */
.strack{display:flex;gap:5px;margin-bottom:13px;}
.st{flex:1;height:3px;border-radius:2px;background:var(--bd);}
.st.done{background:var(--td);}
.st.active{background:var(--g);}

/* TIMER */
#timer{position:fixed;bottom:18px;right:20px;z-index:20;display:none;flex-direction:column;align-items:center;}
.tc{position:relative;width:60px;height:60px;}
.tc svg{transform:rotate(-90deg);}
.tn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;color:var(--g);transition:color .3s;}
.tl{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--tm);margin-top:3px;}

/* QUESTION BOX */
.qb{background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:13px 17px;margin-bottom:5px;}
.qt{font-family:'Playfair Display',serif;font-size:1.13rem;color:var(--t);line-height:1.45;}
.qt em{font-style:italic;color:var(--g);}

/* TITLE SLIDE */
.tslide{text-align:center;padding:10px 0 16px;}
.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border:1px solid rgba(232,184,75,.34);border-radius:20px;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--g);margin-bottom:16px;}
.tslide h1{font-size:clamp(2.8rem,8vw,5.5rem);margin-bottom:18px;}
.tslide p{max-width:360px;margin:0 auto 18px;}
.tslide .btn{margin-top:0;}

/* METHOD GRID */
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:11px 0;}
.mi{display:flex;gap:8px;padding:10px 11px;background:var(--s1);border:1px solid var(--bd);border-radius:8px;cursor:pointer;transition:border-color .17s,background .17s;align-items:flex-start;}
.mi:hover{border-color:rgba(232,184,75,.4);}
.mi.sel{border-color:var(--g);background:rgba(232,184,75,.08);}
.mi input{accent-color:var(--g);margin-top:3px;flex-shrink:0;pointer-events:none;}
.mn{font-size:.82rem;font-weight:500;color:var(--t);display:block;}
.md{font-size:.71rem;color:var(--tm);display:block;margin-top:1px;}
.mt{font-size:.67rem;color:var(--b);display:block;margin-top:2px;}

/* METHOD RESULT */
.mri{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;border-radius:8px;margin-bottom:7px;border:1px solid;}
.mri.ok{background:rgba(61,219,164,.07);border-color:rgba(61,219,164,.2);}
.mri.no{background:rgba(255,92,106,.07);border-color:rgba(255,92,106,.2);}

/* PROFILE BARS */
.pb{margin:10px 0;}
.pbh{display:flex;justify-content:space-between;font-size:.79rem;color:var(--td);margin-bottom:4px;}
.pbr{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;}
.pbf{height:100%;border-radius:3px;width:0;transition:width 1.5s cubic-bezier(.4,0,.2,1);}

/* ENDING */
.ebadge{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:20px;font-size:.76rem;font-weight:600;letter-spacing:.04em;margin-bottom:13px;}
.eg{background:rgba(61,219,164,.11);color:var(--m);border:1px solid rgba(61,219,164,.28);}
.eo{background:rgba(245,166,35,.11);color:#f5a623;border:1px solid rgba(245,166,35,.28);}
.eb{background:rgba(255,92,106,.11);color:var(--r);border:1px solid rgba(255,92,106,.28);}

/* DEBRIEF */
.di{border-left:3px solid var(--bd);padding:10px 13px;margin-bottom:10px;}
.d1{border-color:var(--m);}
.d2{border-color:#f5a623;}
.d3{border-color:var(--r);}

/* HINT */
#ph{position:fixed;bottom:13px;left:18px;font-size:9px;color:var(--tm);letter-spacing:.1em;z-index:5;}
kbd{font-family:'Jost',sans-serif;padding:1px 5px;background:var(--s2);border:1px solid var(--bd);border-radius:3px;font-size:9px;}

/* GRID2 */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}

@media(max-width:600px){.mgrid,.g2{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="bgd bgd1"></div>
<div class="bgd bgd2"></div>

<nav id="nav">
  <div class="nav-b">Психо<b>диагностика</b> · Квест</div>
  <div id="ndots"></div>
  <div style="width:72px"></div>
</nav>

<main id="main">
  <div id="sl" class="slide fadein"></div>
</main>

<div id="timer">
  <div class="tc">
    <svg width="60" height="60" viewBox="0 0 60 60">
      <circle cx="30" cy="30" r="24" fill="none" stroke="var(--bd)" stroke-width="3"/>
      <circle id="tcp" cx="30" cy="30" r="24" fill="none" stroke="var(--g)" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="0"/>
    </svg>
    <div class="tn" id="tn">45</div>
  </div>
  <div class="tl">обсуждение</div>
</div>

<div id="ph"><kbd>ВЕДУЩИЙ</kbd> — управляй переходами</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────
const S = { E:0, D:0, G:0, Q:0, h:[], cur:'title', sel:new Set() };

// ─── TIMER ───────────────────────────────────────────────────────
let tmr=null, tv=45, TMAX=45;
const CIRC=2*Math.PI*24; // 150.8

function startTimer(sec){
  stopTimer();
  tv=TMAX=sec;
  const el=document.getElementById('timer');
  const prog=document.getElementById('tcp');
  const num=document.getElementById('tn');
  el.style.display='flex';
  prog.style.stroke='var(--g)';
  num.style.color='var(--g)';
  function tick(){
    num.textContent=tv;
    prog.style.strokeDashoffset=CIRC*(1-tv/TMAX);
    if(tv<=0){
      clearInterval(tmr);
      prog.style.stroke='var(--r)';
      num.style.color='var(--r)';
      num.textContent='!';
    }
    tv--;
  }
  tick();
  tmr=setInterval(tick,1000);
}
function stopTimer(){
  clearInterval(tmr);
  document.getElementById('timer').style.display='none';
}

// ─── NAVIGATION ──────────────────────────────────────────────────
function go(id,d){
  if(id==='title'){
    S.E=S.D=S.G=S.Q=0;
    S.h=[];S.cur='title';S.sel.clear();
    stopTimer();render();return;
  }
  if(d){S.E+=(d.E||0);S.D+=(d.D||0);S.G+=(d.G||0);S.Q+=(d.Q||0);}
  S.h.push(S.cur);
  S.cur=id;
  stopTimer();
  render();
  document.getElementById('main').scrollTop=0;
}
function goEnding(){
  if(S.Q>=11)go('eg');
  else if(S.Q>=6)go('eo');
  else go('eb');
}

// ─── RENDER ──────────────────────────────────────────────────────
const SM={
  title:sTitle,rules:sRules,case:sCase,
  ch1:sCh1,ch1_a:sCh1a,ch1_b:sCh1b,ch1_c:sCh1c,
  ch2:sCh2,ch2_a:sCh2a,ch2_b:sCh2b,ch2_c:sCh2c,
  mg:sMG,mg_r:sMGR,
  ch3:sCh3,ch3_a:sCh3a,ch3_b:sCh3b,ch3_c:sCh3c,
  ch4:sCh4,ch4_a:sCh4a,ch4_b:sCh4b,ch4_c:sCh4c,
  ch5:sCh5,ch5_a:sCh5a,ch5_b:sCh5b,ch5_c:sCh5c,
  eg:sEndGood,eo:sEndOk,eb:sEndBad,
  profile:sProfile,debrief:sDebrief
};
function render(){
  const el=document.getElementById('sl');
  el.classList.remove('fadein');
  void el.offsetWidth;
  el.innerHTML=(SM[S.cur]||(() =>`<p style="color:var(--r)">Слайд не найден: ${S.cur}</p>`))();
  el.classList.add('fadein');
  updateDots();
  if(S.cur==='profile')setTimeout(animBars,350);
  if(['ch1','ch2','ch3','ch4','ch5'].includes(S.cur))setTimeout(()=>startTimer(45),250);
}

// ─── NAV DOTS ────────────────────────────────────────────────────
const STEPS=['ch1','ch2','mg','ch3','ch4','ch5'];
function updateDots(){
  document.getElementById('ndots').innerHTML=STEPS.map(s=>{
    const done=S.h.some(x=>x.startsWith(s));
    const active=S.cur.startsWith(s);
    return`<div class="nd ${active?'active':done?'done':''}"></div>`;
  }).join('');
}

// ─── STEP TRACK HELPER ───────────────────────────────────────────
function track(a){
  return Array.from({length:5},(_,i)=>
    `<div class="st ${i<a?'done':i===a?'active':''}"></div>`
  ).join('');
}

// ═══════════════════════════════════════════════════════════════
//  SLIDES
// ═══════════════════════════════════════════════════════════════

function sTitle(){return`
<div class="tslide">
  <div class="eyebrow">⬡ Командный квест · Симуляция</div>
  <h1>ПСИХО<em>ДИАГ</em>НОСТИКА</h1>
  <p>Ты — практикующий психолог. Перед тобой — реальный кейс. Каждое решение меняет судьбу клиента.</p>
  <button class="btn" onclick="go('rules')">Начать игру →</button>
</div>`;}

function sRules(){return`
<div>
  <div class="lbl">Инструкция</div>
  <h2>Как мы играем</h2>
  <ul class="ilist">
    <li><span class="ic">👥</span>Разбейтесь на 2–4 команды прямо сейчас</li>
    <li><span class="ic">⏱</span>На каждый выбор — 45 секунд командного обсуждения</li>
    <li><span class="ic">🎯</span>Один участник озвучивает итоговое решение команды</li>
    <li><span class="ic">🔒</span>Влияние каждого выбора скрыто — раскроется в финале</li>
    <li><span class="ic">🏆</span>Цель: построить точную, глубокую и этичную диагностику</li>
  </ul>
  <div class="card" style="margin-top:14px">
    <h3>Что оценивается?</h3>
    <p>Не команды между собой — общий психодиагностический профиль всей группы. В финале увидите, что получилось.</p>
  </div>
  <button class="btn" onclick="go('case')">Познакомиться с клиентом →</button>
</div>`;}

function sCase(){return`
<div>
  <div class="lbl">Кейс · Входящий запрос</div>
  <h2>Знакомьтесь: Максим</h2>
  <div class="stats">
    <div class="stat"><span class="sv">15</span><span class="sl">лет</span></div>
    <div class="stat"><span class="sv">9</span><span class="sl">класс</span></div>
    <div class="stat"><span class="sv">⚡</span><span class="sl">конфликты</span></div>
  </div>
  <div class="card card-a" style="margin-bottom:9px">
    <h3>Запрос</h3>
    <p>Направлен классным руководителем. Поводы: частые конфликты с одноклассниками, резкое снижение успеваемости за последние 3 месяца.</p>
  </div>
  <div class="card" style="margin-bottom:9px">
    <h3>Из истории</h3>
    <p>До 8 класса — отличник, активно участвовал в секциях. Сейчас замкнут, на уроках срывается, перемены проводит один.</p>
  </div>
  <div class="card">
    <h3>Позиция родителей</h3>
    <p>«Ничего серьёзного — подростковый возраст, само пройдёт». На визит к психологу согласились формально, без интереса.</p>
  </div>
  <div class="badges" style="margin-top:13px">
    <span class="badge bb">Тревожность?</span>
    <span class="badge bb">Конфликт в группе?</span>
    <span class="badge bb">Семейный фон?</span>
    <span class="badge bb">Самооценка?</span>
  </div>
  <button class="btn" onclick="go('ch1')">Принять клиента →</button>
</div>`;}

// ─── CHOICE 1: CONTACT ───────────────────────────────────────────
function sCh1(){return`
<div>
  <div class="strack">${track(0)}</div>
  <div class="lbl">Точка 1 / 5 · Установление контакта</div>
  <div class="qb">
    <div class="qt">Максим заходит в кабинет. Садится боком, смотрит в окно. Как ты начинаешь беседу?</div>
  </div>
  <div class="choices">
    <button class="ch" onclick="go('ch1_a',{E:0,D:2,G:1,Q:1})">
      <span class="ch-l">А</span><span>
        <span class="ch-m">Объясняешь цель встречи, просишь заполнить анкету для знакомства</span>
        <span class="ch-s">Структурированный, профессиональный старт</span>
      </span>
    </button>
    <button class="ch" onclick="go('ch1_b',{E:3,D:0,G:2,Q:3})">
      <span class="ch-l">Б</span><span>
        <span class="ch-m">Говоришь что-то нейтральное о помещении или дне — не торопишься к «делу»</span>
        <span class="ch-s">Неформальный старт, создание безопасного пространства</span>
      </span>
    </button>
    <button class="ch" onclick="go('ch1_c',{E:-1,D:2,G:0,Q:0})">
      <span class="ch-l">В</span><span>
        <span class="ch-m">Сразу предлагаешь пройти несколько тестов — «займёт минут 20»</span>
        <span class="ch-s">Эффективно по времени, задаёт рабочий тон</span>
      </span>
    </button>
  </div>
</div>`;}

function sCh1a(){return`
<div>
  <div class="lbl">Последствие · Выбор А</div>
  <h2>Контакт — формальный</h2>
  <div class="card card-a">
    <p>Максим отвечает по существу, но держится дистанции. Он воспринимает тебя как «ещё одного взрослого со своими правилами». Анкету заполнил — механически.</p>
  </div>
  <div class="badges">
    <span class="badge bb">Структура ✓</span>
    <span class="badge br">Раппорт ✗</span>
    <span class="badge bb">Готовность клиента — нейтральная</span>
  </div>
  <button class="btn" onclick="go('ch2')">Дальше →</button>
</div>`;}

function sCh1b(){return`
<div>
  <div class="lbl">Последствие · Выбор Б</div>
  <h2>Контакт установлен</h2>
  <div class="card card-a">
    <p>Ты заметил, как Максим расслабился, когда разговор случайно зашёл о его интересах. Ответил развёрнуто — даже улыбнулся. Пауза перед работой сделала своё дело.</p>
  </div>
  <div class="badges">
    <span class="badge bg">Раппорт ✓</span>
    <span class="badge bg">Открытость клиента ✓</span>
    <span class="badge bg">Доверие — растёт</span>
  </div>
  <button class="btn" onclick="go('ch2')">Дальше →</button>
</div>`;}

function sCh1c(){return`
<div>
  <div class="lbl">Последствие · Выбор В</div>
  <h2>Сопротивление с первых минут</h2>

function toggleM(id,el){
  const cb=document.getElementById('mc_'+id);
  if(S.sel.has(id)){S.sel.delete(id);el.classList.remove('sel');cb.checked=false;}
  else if(S.sel.size<4){S.sel.add(id);el.classList.add('sel');cb.checked=true;}
  document.getElementById('mcnt').textContent=`Выбрано: ${S.sel.size} / 4`;
}

function submitMG(){
  if(S.sel.size===0){alert('Выбери хотя бы одну методику');return;}
  const good=MT.filter(m=>m.ok).map(m=>m.id);
  const gs=[...S.sel].filter(id=>good.includes(id)).length;
  const bs=[...S.sel].filter(id=>!good.includes(id)).length;
  if(gs>=4&&bs===0){S.Q+=2;S.G+=2;}
  else if(gs>=3&&bs<=1){S.Q+=1;S.G+=1;}
  go('mg_r');
}

// ─── PROFILE ─────────────────────────────────────────────────────
function sProfile(){
  const eM=11,dM=10,gM=14;
  const eP=Math.round(Math.max(0,S.E)/eM*100);
  const dP=Math.round(Math.max(0,S.D)/dM*100);
  const gP=Math.round(Math.max(0,S.G)/gM*100);
  let type,desc;
  if(gP>=60&&eP>=50){type='Клиент-центрированный диагност';desc='Высокий приоритет отношений и глубины. Умеете слышать клиента и строить работу вокруг него, а не вокруг методик.';}
  else if(gP>=60&&dP>=50){type='Структурный диагност';desc='Сильная опора на систему и данные. Диагностика глубокая, но иногда недостаточно гибкая в живом контакте.';}
  else if(eP>=50&&gP<50){type='Эмпатичный, но поверхностный';desc='Хороший контакт с клиентом, но диагностика остаётся на уровне ощущений. Стоит добавить систему.';}
  else if(dP>=50&&eP<30){type='Директивный исполнитель';desc='Сильная структура, но слабый контакт. Риск получить формальные данные без реального понимания клиента.';}
  else{type='Формальный диагност';desc='Диагностика по протоколу, без выраженного стиля. Хорошая база — стоит развивать и эмпатию, и аналитическую глубину.';}
  return`
<div>
  <div class="lbl">Финал · Психодиагностический профиль</div>
  <h2>${type}</h2>
  <p style="margin-bottom:16px">${desc}</p>
  <div class="card" style="margin-bottom:9px">
    <div class="pb">
      <div class="pbh"><span>Эмпатия / Раппорт</span><span>${eP}%</span></div>
      <div class="pbr"><div class="pbf" id="pbE" style="background:var(--m)"></div></div>
    </div>
    <div class="pb">
      <div class="pbh"><span>Директивность</span><span>${dP}%</span></div>
      <div class="pbr"><div class="pbf" id="pbD" style="background:var(--b)"></div></div>
    </div>
    <div class="pb">
      <div class="pbh"><span>Глубина диагностики</span><span>${gP}%</span></div>
      <div class="pbr"><div class="pbf" id="pbG" style="background:var(--g)"></div></div>
    </div>
  </div>
  <div class="g2">
    <div class="card">
      <h3>Счёт качества</h3>
      <p>Набрано: <strong style="color:var(--g);font-size:1.3rem">${S.Q}</strong> из 17</p>
    </div>
    <div class="card">
      <h3>Итог</h3>
      <p>${S.Q>=11?'Успешная диагностика ✦':S.Q>=6?'Поверхностная ◈':'С ошибками ✕'}</p>
    </div>
  </div>
  <button class="btn" onclick="go('debrief')">Разбор решений →</button>
</div>`;}

function animBars(){
  const eM=11,dM=10,gM=14;
  const eP=Math.round(Math.max(0,S.E)/eM*100);
  const dP=Math.round(Math.max(0,S.D)/dM*100);
  const gP=Math.round(Math.max(0,S.G)/gM*100);
  const bE=document.getElementById('pbE');
  const bD=document.getElementById('pbD');
  const bG=document.getElementById('pbG');
  if(bE)bE.style.width=eP+'%';
  if(bD)bD.style.width=dP+'%';
  if(bG)bG.style.width=gP+'%';
}

    {step:'Точка 2: Выбор методик',best:'Проективные + самоотчёт (А)',why:'Оптимальный баланс для подростка: проективные снижают защиту, опросник даёт стандартизированные данные. Методики должны соответствовать возрасту клиента.',lvl:'d1'},

    {step:'Точка 3: Сопротивление клиента',best:'Принять и перейти к разговору (А)',why:'Гибкость важнее плана. Данные под давлением часто недостоверны. Сам разговор — тоже диагностический материал.',lvl:'d1'},
    {step:'Точка 4: Интерпретация',best:'Исследовать расхождение (А)',why:'Несоответствие самоотчёта и проективных данных — диагностический факт, а не помеха. Оно говорит о механизмах защиты и уровне рефлексии клиента.',lvl:'d1'},

    <div style="font-weight:600;color:var(--t);margin-bottom:4px;font-size:.9rem">✓ ${c.best}</div>
    <div style="font-size:.83rem;color:var(--td);line-height:1.55">${c.why}</div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">
